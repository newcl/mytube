apiVersion: v1
kind: Namespace
metadata:
  name: mytube
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mytube-data
spec:
  capacity:
    storage: 75Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mytube-local
  local:
    path: /srv/mytube
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - miniu1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mytube-data
  namespace: mytube
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: mytube-local
  volumeName: mytube-data
  resources:
    requests:
      storage: 75Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mytube
  namespace: mytube
  labels:
    app.kubernetes.io/name: mytube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mytube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mytube
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-data
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - mkdir -p /data/downloads && chown 10001:10001 /data /data/downloads
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: mytube
          # The deployment procedure replaces this local tag with the immutable
          # commit tag imported into k3s containerd.
          image: docker.io/library/mytube-backend:20260723-5
          imagePullPolicy: Never
          env:
            - name: HOME
              value: /data
            - name: MYTUBE_BIND
              value: :8080
            - name: MYTUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mytube-secrets
                  key: token
            - name: MYTUBE_DB_PATH
              value: /data/mytube.db
            - name: MYTUBE_DOWNLOAD_DIR
              value: /data/downloads
            - name: MYTUBE_CONCURRENCY
              value: "2"
            - name: MYTUBE_CORS_ORIGIN
              value: https://mytube.elladali.com,https://mytube-3na.pages.dev
            - name: MYTUBE_PUBLIC_BASE_URL
              value: https://mytubeapi.elladali.com
            - name: MYTUBE_JS_RUNTIME
              value: node
            - name: MYTUBE_COOKIE_FILE
              value: /data/cookies/cookies.txt
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mytube-data
---
apiVersion: v1
kind: Service
metadata:
  name: mytube
  namespace: mytube
spec:
  selector:
    app.kubernetes.io/name: mytube
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mytube
  namespace: mytube
spec:
  ingressClassName: traefik
  rules:
    - host: mytubeapi.elladali.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mytube
                port:
                  name: http
